---
name: Lint

on:
  push:
    branches: [main]
    paths: &ci-paths
      - '**/*.php'
      - 'composer.*'
      - 'phpcs.xml'
      - 'phpstan*'
      - 'phpunit.xml'
      - 'patchwork.json'
      - 'tests/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths: *ci-paths
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash shell also turns on pipefail for every run step.
defaults:
  run:
    shell: bash

jobs:
  quality:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2, cs2pr

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHP_CodeSniffer
        run: |
          vendor/bin/phpcs -q --report=checkstyle \
            --runtime-set ignore_warnings_on_exit 1 | cs2pr --graceful-warnings

      - name: PHPStan
        run: |
          vendor/bin/phpstan analyse --memory-limit=1G \
            --error-format=checkstyle | cs2pr

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: >-
          composer install --no-dev --no-progress --prefer-dist
          --optimize-autoloader

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-checks: |
            late_escaping
            plugin_review_phpcs
            file_type
            plugin_readme
            plugin_updater

  test:
    name: PHPUnit ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHPUnit
        run: vendor/bin/phpunit
