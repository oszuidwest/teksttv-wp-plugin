---
name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'
      - 'phpstan-bootstrap.php'
      - 'phpunit.xml'
      - 'patchwork.json'
      - 'tests/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'
      - 'phpstan-bootstrap.php'
      - 'phpunit.xml'
      - 'patchwork.json'
      - 'tests/**'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # Preserve the required check name previously emitted by wp-ci.yml@v2.
    name: lint / PHP 8.3
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2, cs2pr

      - name: Validate PHP syntax
        run: find . -maxdepth 1 -name '*.php' -exec php --syntax-check {} +

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHP_CodeSniffer
        run: |
          set -o pipefail
          vendor/bin/phpcs -q --report=checkstyle \
            --runtime-set ignore_warnings_on_exit 1 \
            | cs2pr --graceful-warnings

      - name: PHPStan
        run: |
          set -o pipefail
          vendor/bin/phpstan analyse --error-format=checkstyle | cs2pr

  plugin-check:
    # Preserve the required check name while running Plugin Check only once.
    name: lint / PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: >-
          composer install --no-dev --no-progress --prefer-dist
          --optimize-autoloader

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-checks: |
            late_escaping
            plugin_review_phpcs
            file_type
            plugin_readme
            plugin_updater

  translations:
    # This project has no translation catalog. Preserve the required check name
    # until branch protection can drop the legacy reusable-workflow context.
    name: lint / Translations
    runs-on: ubuntu-latest
    steps:
      - run: echo "No translation catalog to validate."

  test:
    name: PHPUnit ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHPUnit
        run: vendor/bin/phpunit
