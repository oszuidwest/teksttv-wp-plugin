---
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Extract and validate version
        id: version
        run: |
          VERSION="$(bash bin/plugin-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # The packager writes its zip= output to GITHUB_OUTPUT itself, so the
      # artifact naming convention lives only in bin/package-plugin.sh.
      - name: Build and validate canonical plugin artifact
        id: package
        run: bun run build:package

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}" || true)"
          if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERSION already points to $TAG_COMMIT; bump the plugin version."
            exit 1
          fi

          # GitHub CLI creates a draft, uploads the ZIP, and then publishes it.
          # Repository-native immutability locks the resulting tag and asset.
          ARGS=(
            "$VERSION"
            "$ZIP"
            --target "$GITHUB_SHA"
            --fail-on-no-commits
            --title "$VERSION"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
