---
name: Release

on:
  push:
    tags:
      # Version shape only; the exact-match check below is the real gate.
      - '[0-9]+.[0-9]+.[0-9]+*'

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          VERSION="$(bash bin/plugin-version.sh)"
          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match" \
              "plugin version '$VERSION'."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          # Reads engines.node so package.json stays the single source of truth.
          node-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build and validate canonical plugin artifact
        id: package
        run: bun run build:package

      # Smoke the exact ZIP being published, not the packager's staging dir.
      - name: Stage the published ZIP for smoke testing
        env:
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          rm -rf release/teksttv
          unzip -q "$ZIP" -d release

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Test the release artifact in WordPress Playground
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag equals the plugin version; the validation step enforced it.
          VERSION: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          # Tags are only locked after publication, so re-check that the tag
          # still points at the commit this run built before releasing.
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq .sha)"
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $VERSION moved to $TAG_SHA during the build;" \
              "this run built $GITHUB_SHA."
            exit 1
          fi
          # Core reads this through the plugin's Update URI header.
          header() { sed -En "s/^ \* $1: ([0-9.]+)\$/\1/p" teksttv.php; }
          WP="$(header 'Requires at least')" PHP="$(header 'Requires PHP')"
          # Core takes an empty minimum to mean every site is compatible.
          : "${WP:?no Requires at least header}" "${PHP:?no Requires PHP header}"
          jq -n --arg v "$VERSION" --arg wp "$WP" --arg php "$PHP" \
            --arg r "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" '{
              name: "TekstTV", slug: "teksttv", version: $v,
              requires: $wp, requires_php: $php,
              package: "\($r)/download/\($v)/teksttv-\($v).zip",
              sections: {changelog: "<a href=\"\($r)/tag/\($v)\">Release notes</a>"}
            } | .download_link = .package' > teksttv.json
          ARGS=(
            "$VERSION"
            "$ZIP"
            teksttv.json
            --verify-tag
            --title "$VERSION"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
