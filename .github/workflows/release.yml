---
name: Release

on:
  push:
    tags:
      # Version shape only; the exact-match check below is the real gate.
      - '[0-9]+.[0-9]+.[0-9]+*'

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          VERSION="$(bash bin/plugin-version.sh)"
          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match" \
              "plugin version '$VERSION'."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build and validate canonical plugin artifact
        id: package
        run: bun run build:package

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag equals the plugin version; the validation step enforced it.
          VERSION: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          ARGS=(
            "$VERSION"
            "$ZIP"
            --verify-tag
            --title "$VERSION"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
