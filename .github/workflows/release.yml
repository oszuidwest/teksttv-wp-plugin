---
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if the version was not bumped'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve plugin slug and main file
        id: slug
        run: |
          SLUG="teksttv"
          MAIN_FILE="${SLUG}.php"
          if [ ! -f "$MAIN_FILE" ]; then
            echo "::error::Main plugin file '$MAIN_FILE' missing at repo root."
            exit 1
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "main_file=$MAIN_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract and validate version
        id: version
        env:
          MAIN_FILE: ${{ steps.slug.outputs.main_file }}
        run: |
          VERSION=$(sed -n \
            's/.*Version:[[:space:]]*\([0-9a-zA-Z.-]\+\).*/\1/p' \
            "$MAIN_FILE" | head -1)
          PRE='(-(alpha|beta|rc)\.[0-9]+)?'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+${PRE}$ ]]; then
            echo "::error::Invalid version in $MAIN_FILE: '$VERSION'."
            echo "::error::Expected X.Y.Z or X.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          LATEST_TAG=$(git describe --tags \
            "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "")
          LATEST_BARE="${LATEST_TAG#v}"
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }
          if [ "$FORCE" = "true" ]; then
            DECISION=true
            REASON="forced"
          elif [ -z "$LATEST_TAG" ]; then
            DECISION=true
            REASON="first release"
          elif version_gt "$VERSION" "$LATEST_BARE"; then
            DECISION=true
            REASON="version bumped from $LATEST_TAG to $VERSION"
          else
            DECISION=false
            REASON="no bump (latest: $LATEST_TAG, header: $VERSION)"
          fi
          echo "Release decision: $DECISION ($REASON)"
          echo "release_needed=$DECISION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.decide.outputs.release_needed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2
        if: steps.decide.outputs.release_needed == 'true'

      - name: Install JS dependencies
        if: steps.decide.outputs.release_needed == 'true'
        run: bun install --frozen-lockfile

      - name: Build and validate canonical plugin artifact
        if: steps.decide.outputs.release_needed == 'true'
        id: package
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          bun run build:package
          ZIP="release/teksttv-${VERSION}.zip"
          test -f "$ZIP"
          ls -la "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Tag the built commit
        if: steps.decide.outputs.release_needed == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tag only after the ZIP is proven, so a failed build never leaves an
          # orphan tag. On the force path, move an existing tag to the built
          # commit so the tag always matches the artifact just packaged.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::notice::Tag $VERSION already exists; moving it to built commit $(git rev-parse --short HEAD) (force path)."
            git tag -f "$VERSION"
            git push -f origin "refs/tags/$VERSION"
          else
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Create GitHub release
        if: steps.decide.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          ARGS=("$VERSION" "$ZIP" --title "$VERSION" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"

      - name: Report skipped release
        if: steps.decide.outputs.release_needed != 'true'
        run: |
          echo "::notice::Skipping release: no version bump."
          echo "Re-run the workflow with the 'force' input to release anyway."
