---
name: JS Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - 'tsconfig.json'
      - '.github/workflows/js-lint.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - 'tsconfig.json'
      - '.github/workflows/js-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Biome + TypeScript + Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check:frontend
