---
name: Build Plugin

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bin/**'
      - 'teksttv.php'
      - 'src/**'
      - 'resources/**'
      - 'tests/e2e/**'
      - 'tests/*.sh'
      - 'blueprint.json'
      - 'playwright.config.ts'
      - '.github/workflows/build-plugin.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bin/**'
      - 'teksttv.php'
      - 'src/**'
      - 'resources/**'
      - 'tests/e2e/**'
      - 'tests/*.sh'
      - 'blueprint.json'
      - 'playwright.config.ts'
      - '.github/workflows/build-plugin.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Test production version validation
        run: bash tests/package-version.sh

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Assert packaging rejects missing build output
        run: |
          if OUTPUT=$(bash bin/package-plugin.sh 2>&1); then
            echo "::error::Packager accepted a checkout without built assets."
            exit 1
          fi
          printf '%s\n' "$OUTPUT"
          grep -Fq "Required built asset 'assets/admin.css' is missing" <<< "$OUTPUT"

      - name: Build, validate, and audit canonical plugin artifact
        run: |
          trap 'rm -f PACKAGE_AUDIT_CANARY.md src/package-audit-canary.php assets/package-audit-canary.js' EXIT
          mkdir -p assets
          touch PACKAGE_AUDIT_CANARY.md src/package-audit-canary.php assets/package-audit-canary.js
          bun run build:package
          for CANARY in PACKAGE_AUDIT_CANARY.md src/package-audit-canary.php assets/package-audit-canary.js; do
            test ! -e "release/teksttv/$CANARY"
          done

      - name: Upload validated plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: teksttv-plugin
          path: release/teksttv/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: WordPress smoke (build + activate + REST + browser)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Reads engines.node so package.json stays the single source of truth.
          node-version-file: package.json

      - uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Download validated plugin artifact
        uses: actions/download-artifact@v8
        with:
          name: teksttv-plugin
          path: release/teksttv

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run e2e suite in WordPress Playground
        run: bun run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
