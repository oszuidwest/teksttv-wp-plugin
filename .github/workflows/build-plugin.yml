---
name: Build Plugin

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bin/**'
      - 'teksttv.php'
      - 'src/**'
      - 'resources/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bin/**'
      - 'teksttv.php'
      - 'src/**'
      - 'resources/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - uses: oven-sh/setup-bun@v2

      - name: Assert package preflight rejects missing build output
        run: |
          if OUTPUT=$(bash bin/package-plugin.sh 2>&1); then
            echo "::error::Packager unexpectedly accepted a clean checkout without built assets."
            exit 1
          fi
          echo "$OUTPUT"
          grep -F "Required built asset 'assets/admin.css' is missing" <<< "$OUTPUT"

      - run: bun install --frozen-lockfile

      - name: Build, validate, and audit canonical plugin artifact
        run: |
          trap 'rm -f PACKAGE_AUDIT_CANARY.md src/package-audit-canary.php assets/package-audit-canary.js' EXIT
          mkdir -p assets
          printf 'root canary\n' > PACKAGE_AUDIT_CANARY.md
          printf '<?php // source canary\n' > src/package-audit-canary.php
          printf '// asset canary\n' > assets/package-audit-canary.js

          bun run build:package

          test ! -e release/teksttv/PACKAGE_AUDIT_CANARY.md
          test ! -e release/teksttv/src/package-audit-canary.php
          test ! -e release/teksttv/assets/package-audit-canary.js
