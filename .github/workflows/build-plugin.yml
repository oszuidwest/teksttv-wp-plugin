---
name: Build Plugin

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bin/**'
      - 'teksttv.php'
      - 'src/**'
      - 'resources/**'
      - '.github/workflows/build-plugin.yml'
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'bun.lock'
      - 'bin/**'
      - 'teksttv.php'
      - 'src/**'
      - 'resources/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Run packaging self-test (preflight, build, canary audit)
        run: bash bin/test-package.sh
